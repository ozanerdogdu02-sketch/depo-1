# Netlify yapılandırması. Netlify arayüzündeki ayarlar (build=npm run build,
# publish=dist) buraya taşındı — fonksiyon eklemek için zaten bir dosya gerekiyordu ve
# yapılandırmanın yarısı arayüzde yarısı repoda durmasındansa tamamı repoda dursun.
#
# Uygulama repo kökündedir; base directory boş bırakılır.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# EVDS proxy'si /api/evds adresinden de çağrılabilsin (fonksiyonun kendi config.path'i ile
# birlikte çalışır; istemci kısa yolu kullanır, uzun yol da bozulmaz).
[[redirects]]
  from = "/api/evds"
  to = "/.netlify/functions/evds"
  status = 200
