# Netlify yapılandırması. Netlify arayüzündeki ayarlar (build=npm run build,
# publish=dist) buraya taşındı — fonksiyon eklemek için zaten bir dosya gerekiyordu ve
# yapılandırmanın yarısı arayüzde yarısı repoda durmasındansa tamamı repoda dursun.
#
# Uygulama repo kökündedir; base directory boş bırakılır.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# EVDS proxy'si /api/evds adresinden de çağrılabilsin (fonksiyonun kendi config.path'i ile
# birlikte çalışır; istemci kısa yolu kullanır, uzun yol da bozulmaz).
[[redirects]]
  from = "/api/evds"
  to = "/.netlify/functions/evds"
  status = 200

# Güvenlik başlıkları — vercel.json ile aynı değerler (tek kaynak: vercel.json; değişirse ikisini birlikte güncelle).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.frankfurter.dev https://api.coingecko.com https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
