<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- FAGENT sekme ikonu. Koyu zemin + teal aksan; uygulamanın index.css'indeki
       --bg (#0a0f14) ve --accent (#2dd4a7) değerleriyle aynı.
       Sembol: yükselen bir çizgi ve altında onu kesen yatay bant — "gösterilen getiri"
       ile "gerçekte kalan" arasındaki farkı temsil eder. -->
